<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommuteGuard Pro - Smart Work Alarm</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: #fff;
      padding: 20px;
    }
    .app-container {
      max-width: 420px;
      margin: 0 auto;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 40px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      font-size: 26px;
      background: linear-gradient(45deg, #00dbde, #fc00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .config-item label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }
    .config-item input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      color: #fff;
    }
    #message {
      margin-top: 20px;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>CommuteGuard Pro</h1>
    <div class="config-item">
      <label>🕒 Work Start Time</label>
      <input type="time" id="workTime" value="09:00" />
    </div>
    <div class="config-item">
      <label>📍 Work Location</label>
      <input type="text" id="workLocation" value="123 Main St, Downtown" />
    </div>
    <div class="config-item">
      <label>⏱️ Prep Time (minutes)</label>
      <input type="number" id="prepTime" value="30" min="5" max="180" />
    </div>
    <div style="margin-top: 20px;">
      <button id="setAlarmBtn" style="padding: 12px; width: 100%; border: none; border-radius: 10px; background: linear-gradient(45deg, #00dbde, #fc00ff); color: white; font-weight: bold; font-size: 16px;">🔔 Calculate &amp; Set Alarm</button>
    </div>
    <div id="timeline" style="margin-top: 20px; display: none;">
      <h3 style="font-size: 16px;">Your Morning Plan:</h3>
      <ul style="list-style: none; padding-left: 0; font-size: 14px; margin-top: 10px;">
        <li>⏰ Wake Up: <span id="wakeTime">--:--</span></li>
        <li>🚿 Get Ready: <span id="readyTime">--:--</span></li>
        <li>🚗 Leave by: <span id="leaveTime">--:--</span></li>
        <li>🏢 Arrive at Work: <span id="arriveTime">--:--</span></li>
      </ul>
    </div>
    <div id="message"></div>
  </div>
  <script>
    // Keep track of the scheduled alarm timeout ID
    let alarmTimeoutId = null;
    let currentWakeTime = null;

    function formatTime(mins) {
      const h = Math.floor((mins + 1440) % 1440 / 60);
      const m = (mins + 1440) % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    // Calculate wake‑up and commute times and display them using Google Routes API
    async function calculateTimes() {
      try {
        const apiKey = "AIzaSyBGngOfLnpsPHmOYe8bzNpVkizpxIxWeJc";
        const workTime = document.getElementById("workTime").value;
        const prep = parseInt(document.getElementById("prepTime").value || 0);
        const workAddress = document.getElementById("workLocation").value;

        // Step 1: Get current location
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject);
        });
        const origLat = position.coords.latitude;
        const origLng = position.coords.longitude;

        // Step 2: Geocode work address to get coordinates
        const geoRes = await fetch(
          `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(workAddress)}&key=${apiKey}`
        );
        const geoData = await geoRes.json();
        if (geoData.status !== "OK") throw new Error("Geocoding failed");
        const destLat = geoData.results[0].geometry.location.lat;
        const destLng = geoData.results[0].geometry.location.lng;

        // Step 3: Call Google Routes API for real-time commute time
        const routesUrl = `https://routes.googleapis.com/directions/v2:computeRoutes`;
        const payload = {
          origin: { location: { latLng: { latitude: origLat, longitude: origLng } } },
          destination: { location: { latLng: { latitude: destLat, longitude: destLng } } },
          travelMode: "DRIVE",
          routingPreference: "TRAFFIC_AWARE",
          computeAlternativeRoutes: false,
          languageCode: "en-US",
          units: "IMPERIAL"
        };

        const routeRes = await fetch(routesUrl + `?key=${apiKey}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Goog-Api-Key": apiKey,
            "X-Goog-FieldMask": "routes.duration,routes.travelAdvisory"
          },
          body: JSON.stringify(payload)
        });

        if (!routeRes.ok) throw new Error("Routes API request failed");

        const routeData = await routeRes.json();
        const commuteSeconds = routeData.routes?.[0]?.duration?.seconds || 0;
        const commute = Math.ceil(commuteSeconds / 60);

        // Step 4: Calculate wake-up, ready, leave times
        const [h, m] = workTime.split(":").map(Number);
        const workMins = h * 60 + m;
        const leaveMins = workMins - commute;
        const wakeMins = leaveMins - prep;

        const wake = formatTime(wakeMins);
        const ready = formatTime(wakeMins + prep);
        const leave = formatTime(leaveMins);

        // Update the UI
        document.getElementById("wakeTime").textContent = wake;
        document.getElementById("readyTime").textContent = ready;
        document.getElementById("leaveTime").textContent = leave;
        document.getElementById("arriveTime").textContent = workTime;
        document.getElementById("timeline").style.display = "block";

        // Store wake-up time for scheduling alarm
        currentWakeTime = {
          hours: parseInt(wake.split(":")[0]),
          minutes: parseInt(wake.split(":")[1])
        };
        scheduleAlarm();
      } catch (err) {
        console.error(err);
        alert("Failed to calculate times: " + err.message);
      }
    }

    // Schedule the alarm to trigger exactly at the wake-up time
    function scheduleAlarm() {
      if (!currentWakeTime) return;
      const now = new Date();
      let alarmDate = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        currentWakeTime.hours,
        currentWakeTime.minutes,
        0,
        0
      );
      // If the wake time has already passed today, schedule for tomorrow
      if (alarmDate.getTime() <= now.getTime()) {
        alarmDate.setDate(alarmDate.getDate() + 1);
      }
      const diffMs = alarmDate.getTime() - now.getTime();
      // Clear any existing timer before scheduling a new one
      if (alarmTimeoutId) {
        clearTimeout(alarmTimeoutId);
        alarmTimeoutId = null;
      }
      alarmTimeoutId = setTimeout(() => {
        triggerAlarm();
      }, diffMs);
    }

    // Handle alarm ringing: show message, play beep, re-enable button
    function triggerAlarm() {
      document.getElementById("message").textContent = "⏰ WAKE UP! Time for work!";
      // Play a one-second sine wave tone
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = ctx.createOscillator();
        oscillator.type = "sine";
        oscillator.frequency.value = 440;
        oscillator.connect(ctx.destination);
        oscillator.start();
        oscillator.stop(ctx.currentTime + 1);
      } catch (err) {
        console.error(err);
      }
      // Re-enable the button and restore opacity
      const alarmBtn = document.getElementById("setAlarmBtn");
      if (alarmBtn) {
        alarmBtn.disabled = false;
        alarmBtn.style.opacity = "1";
      }
    }

    // Button handler to calculate times and schedule the alarm
    document.getElementById("setAlarmBtn").addEventListener("click", async () => {
      const alarmBtn = document.getElementById("setAlarmBtn");
      // Disable the button and reduce opacity to show it has been clicked
      if (alarmBtn) {
        alarmBtn.disabled = true;
        alarmBtn.style.opacity = "0.6";
      }
      await calculateTimes();
      const wakeTimeStr = document.getElementById("wakeTime").textContent;
      document.getElementById("message").textContent = `✅ Alarm set for ${wakeTimeStr}`;
    });
  </script>
</body>
</html>
