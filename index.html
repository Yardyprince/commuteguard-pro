<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CommuteGuard Pro - Smart Work Alarm</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: #fff;
      padding: 20px;
    }
    .app-container {
      max-width: 420px;
      margin: 0 auto;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 40px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      font-size: 26px;
      background: linear-gradient(45deg, #00dbde, #fc00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .config-item label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }
    .config-item input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      color: #fff;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #message {
      margin-top: 20px;
      font-size: 18px;
      text-align: center;
    }
    #snoozeBtn {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #ff6b6b;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    #snoozeBtn:hover {
      background: #ff5252;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>CommuteGuard Pro</h1>
    <div class="config-item">
      <label>🕒 Work Start Time</label>
      <input type="time" id="workTime" value="09:00" />
    </div>
    <div class="config-item">
      <label>📍 Work Location</label>
      <input type="text" id="workLocation" value="123 Main St, Downtown" />
    </div>
    <div class="config-item">
      <label>⏱️ Prep Time (minutes)</label>
      <input type="number" id="prepTime" value="30" min="5" max="180" />
    </div>
    <div style="margin-top: 20px;">
      <button id="setAlarmBtn" style="padding: 12px; width: 100%; border: none; border-radius: 10px; background: linear-gradient(45deg, #00dbde, #fc00ff); color: white; font-weight: bold; font-size: 16px;">🔔 Calculate &amp; Set Alarm</button>
    </div>
    <div id="timeline" style="margin-top: 20px; display: none;">
      <h3 style="font-size: 16px;">Your Morning Plan:</h3>
      <ul style="list-style: none; padding-left: 0; font-size: 14px; margin-top: 10px;">
        <li>⏰ Wake Up: <span id="wakeTime">--:--</span></li>
        <li>🚿 Get Ready: <span id="readyTime">--:--</span></li>
        <li>🚗 Leave by: <span id="leaveTime">--:--</span></li>
        <li>🏢 Arrive at Work: <span id="arriveTime">--:--</span></li>
      </ul>
      <div id="alarmControls" style="display: none;">
        <button id="snoozeBtn" onclick="snoozeAlarm()">😴 Snooze Alarm</button>
      </div>
    </div>
    <div id="message"></div>
  </div>
  <script>
    // Keep track of the scheduled alarm timeout ID and user preferences
    const STORAGE_KEY = 'commuteGuard.v1';
    let alarmTimeoutId = null;
    let currentWakeTime = null;
    let alarmActive = false;

    function formatTime(mins) {
      const h = Math.floor((mins + 1440) % 1440 / 60);
      const m = (mins + 1440) % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    // Save user preferences to localStorage
    function savePrefs() {
      const prefs = {
        workTime: document.getElementById('workTime').value,
        workLocation: document.getElementById('workLocation').value,
        prepTime: document.getElementById('prepTime').value
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs));
    }

    // Load preferences from localStorage on page load
    function loadPrefs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p.workTime) document.getElementById('workTime').value = p.workTime;
        if (p.workLocation) document.getElementById('workLocation').value = p.workLocation;
        if (p.prepTime) document.getElementById('prepTime').value = p.prepTime;
      } catch {
        // ignore malformed data
      }
    }

    // Toggle button busy state
    function setBusy(btn, busy) {
      if (!btn) return;
      btn.disabled = busy;
      btn.style.opacity = busy ? '0.6' : '1';
    }

    // Validate inputs before calculation
    function validateInputs() {
      const prepVal = Number(document.getElementById('prepTime').value);
      if (!Number.isFinite(prepVal) || prepVal < 0 || prepVal > 300) {
        showMsg('Prep time must be between 0 and 300 minutes', 'error');
        return false;
      }
      const locVal = document.getElementById('workLocation').value.trim();
      if (!locVal) {
        showMsg('Please enter a work location', 'error');
        return false;
      }
      return true;
    }

    // Display a message with optional error styling
    function showMsg(text, kind = 'info') {
      const el = document.getElementById('message');
      el.textContent = text;
      el.style.color = kind === 'error' ? '#ffb3b3' : '#fff';
    }

    // Request notification permission (updated for native bridge)
    async function requestNotificationPermission() {
      // If native bridge exists, use it
      if (window.nativeBridge) {
        window.nativeBridge.requestPermission();
        // Wait a bit for the permission response
        await new Promise(resolve => setTimeout(resolve, 1000));
        return true;
      }
      
      // Fallback to web notifications
      if (!('Notification' in window)) return false;
      if (Notification.permission === 'granted') return true;
      if (Notification.permission === 'denied') return false;
      const perm = await Notification.requestPermission();
      return perm === 'granted';
    }

    // Calculate wake-up and commute times using Google Routes API and schedule alarm
    async function calculateTimes() {
      console.log('🚀 Starting calculateTimes...');
      
      try {
        const apiKey = 'AIzaSyBGngOfLnpsPHmOYe8bzNpVkizpxIxWeJc';
        const workTime = document.getElementById('workTime').value;
        const prep = parseInt(document.getElementById('prepTime').value || 0);
        const workAddress = document.getElementById('workLocation').value;
        
        console.log('📍 Inputs:', { workTime, prep, workAddress });
        
        // Save preferences
        savePrefs();

        // Get current location
        console.log('📍 Getting current location...');
        showMsg('Getting your location...', 'info');
        
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              console.log('✅ Got position');
              resolve(pos);
            },
            (err) => {
              console.error('❌ Location error:', err);
              reject(err);
            },
            { timeout: 10000, enableHighAccuracy: true }
          );
        });
        
        console.log('📍 Position:', position.coords.latitude, position.coords.longitude);
        const origLat = position.coords.latitude;
        const origLng = position.coords.longitude;

        // Geocode work address
        console.log('🏢 Geocoding work address...');
        showMsg('Looking up work location...', 'info');
        
        const geoRes = await fetch(
          `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(workAddress)}&key=${apiKey}`
        );
        const geoData = await geoRes.json();
        console.log('🏢 Geocode response:', geoData);
        
        if (geoData.status !== 'OK') {
          console.error('❌ Geocoding failed:', geoData.status);
          throw new Error('Could not find work location: ' + geoData.status);
        }
        
        const destLat = geoData.results[0].geometry.location.lat;
        const destLng = geoData.results[0].geometry.location.lng;
        console.log('🏢 Work coordinates:', destLat, destLng);

        // Call Google Routes API for real-time commute
        console.log('🚗 Calculating route...');
        showMsg('Calculating commute time...', 'info');
        
        const routesUrl = 'https://routes.googleapis.com/directions/v2:computeRoutes';
        const payload = {
          origin: { location: { latLng: { latitude: origLat, longitude: origLng } } },
          destination: { location: { latLng: { latitude: destLat, longitude: destLng } } },
          travelMode: 'DRIVE',
          routingPreference: 'TRAFFIC_AWARE',
          computeAlternativeRoutes: false,
          languageCode: 'en-US',
          units: 'IMPERIAL'
        };
        
        console.log('🚗 Route request payload:', JSON.stringify(payload));
        
        const routeRes = await fetch(routesUrl + `?key=${apiKey}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Goog-Api-Key': apiKey,
            'X-Goog-FieldMask': 'routes.duration,routes.travelAdvisory'
          },
          body: JSON.stringify(payload)
        });
        
        console.log('🚗 Route response status:', routeRes.status);
        
        if (!routeRes.ok) {
          const errorText = await routeRes.text();
          console.error('❌ Route API error:', errorText);
          throw new Error('Could not calculate route: ' + routeRes.status);
        }
        
        const routeData = await routeRes.json();
        console.log('🚗 Route data:', routeData);
        
        const commuteSeconds = routeData.routes?.[0]?.duration?.seconds || 0;
        let commute = Math.ceil(commuteSeconds / 60);
        
        console.log('⏱️ Commute time:', commute, 'minutes');
        
        if (commute === 0) {
          console.warn('⚠️ Warning: Commute time is 0 minutes, using default 15 minutes');
          commute = 15; // Default to 15 minutes if API returns 0
        }

        // Calculate times
        const [h, m] = workTime.split(':').map(Number);
        const workMins = h * 60 + m;
        const leaveMins = workMins - commute;
        const wakeMins = leaveMins - prep;

        const wake = formatTime(wakeMins);
        const ready = formatTime(wakeMins + prep);
        const leave = formatTime(leaveMins);

        console.log('📊 Calculations:', {
          workMins,
          commute,
          prep,
          leaveMins,
          wakeMins,
          wake,
          ready,
          leave
        });

        // Update UI timeline
        document.getElementById('wakeTime').textContent = wake;
        document.getElementById('readyTime').textContent = ready;
        document.getElementById('leaveTime').textContent = leave;
        document.getElementById('arriveTime').textContent = workTime;
        document.getElementById('timeline').style.display = 'block';

        // Store wake-up time and schedule alarm
        currentWakeTime = {
          hours: parseInt(wake.split(':')[0]),
          minutes: parseInt(wake.split(':')[1])
        };
        scheduleAlarm();
        showAlarmControls();
      } catch (err) {
        console.error('❌ Error in calculateTimes:', err);
        showMsg(`Error: ${err.message}`, 'error');
        setBusy(document.getElementById('setAlarmBtn'), false);
      }
    }

    // Schedule the alarm to trigger exactly at the wake-up time (updated for native bridge)
    function scheduleAlarm() {
      if (!currentWakeTime) return;
      
      const wakeStr = `${String(currentWakeTime.hours).padStart(2, '0')}:${String(currentWakeTime.minutes).padStart(2, '0')}`;
      const prepTime = parseInt(document.getElementById('prepTime').value || 30);
      const workTime = document.getElementById('workTime').value;
      const workLocation = document.getElementById('workLocation').value;
      
      // Show estimated time message
      showMsg('⏰ Alarm set! I\'ll recheck traffic 30 min before to ensure accuracy.', 'info');
      
      // Use native bridge to schedule iOS notification if available
      if (window.nativeBridge) {
        window.nativeBridge.setAlarm(wakeStr, prepTime, workTime, workLocation);
      }
      
      // Still use setTimeout for immediate feedback when app is open
      const now = new Date();
      let alarmDate = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        currentWakeTime.hours,
        currentWakeTime.minutes,
        0,
        0
      );
      if (alarmDate.getTime() <= now.getTime()) {
        alarmDate.setDate(alarmDate.getDate() + 1);
      }
      const diffMs = alarmDate.getTime() - now.getTime();
      
      if (alarmTimeoutId) {
        clearTimeout(alarmTimeoutId);
        alarmTimeoutId = null;
      }
      
      alarmTimeoutId = setTimeout(() => {
        triggerAlarm();
      }, diffMs);
    }

    // Handle alarm ringing: show message, beep, notification, reset button (updated for native bridge)
    async function triggerAlarm() {
      showMsg('⏰ WAKE UP! Time for work!');
      showAlarmControls();
      
      // Use native sound if available
      if (window.nativeBridge) {
        window.nativeBridge.playSound();
      } else {
        // Fallback to web audio
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = ctx.createOscillator();
          oscillator.type = 'sine';
          oscillator.frequency.value = 440;
          oscillator.connect(ctx.destination);
          oscillator.start();
          oscillator.stop(ctx.currentTime + 1);
        } catch (err) {
          console.error(err);
        }
      }
      
      // Send web notification as fallback
      if (!window.nativeBridge && await requestNotificationPermission()) {
        new Notification('CommuteGuard Pro', { body: 'Wake up time. Let\'s go.' });
      }
    }

    // Handle snooze button
    function snoozeAlarm() {
      if (window.nativeBridge) {
        window.nativeBridge.snoozeAlarm();
        showMsg('Alarm snoozed', 'info');
      }
    }

    // Stop alarm sound when user opens app
    function stopAlarmSound() {
      if (window.nativeBridge) {
        window.nativeBridge.stopAlarmSound();
      }
    }

    // Show/hide alarm controls
    function showAlarmControls() {
      const controls = document.getElementById('alarmControls');
      if (controls && alarmActive) {
        controls.style.display = 'block';
      }
    }

    function hideAlarmControls() {
      const controls = document.getElementById('alarmControls');
      if (controls) {
        controls.style.display = 'none';
      }
    }

    // Callbacks from native
    window.alarmSnoozed = function(interval) {
      const minutes = Math.round(interval / 60);
      showMsg(`Alarm snoozed for ${minutes} minutes`, 'info');
    };

    window.userStartedDriving = function() {
      showMsg('🚗 Drive safe! Alarm stopped automatically.', 'info');
      alarmActive = false;
      const btn = document.getElementById('setAlarmBtn');
      if (btn) {
        btn.textContent = '🔔 Calculate & Set Alarm';
        setBusy(btn, false);
      }
      hideAlarmControls();
    };

    // New callback for traffic recheck
    window.trafficRechecked = function(newWakeTime, trafficChanged) {
      if (trafficChanged) {
        showMsg(`🚦 Traffic update: Wake time adjusted to ${newWakeTime}`, 'info');
        document.getElementById('wakeTime').textContent = newWakeTime;
        
        // Update other times based on new wake time
        const [h, m] = newWakeTime.split(':').map(Number);
        const wakeMins = h * 60 + m;
        const prep = parseInt(document.getElementById('prepTime').value || 30);
        
        const ready = formatTime(wakeMins + prep);
        const leave = formatTime(wakeMins + prep);
        
        document.getElementById('readyTime').textContent = ready;
        document.getElementById('leaveTime').textContent = leave;
      }
    };

    window.alarmScheduled = true;
    window.alarmCanceled = true;

    // Event listener for the alarm button (updated for native bridge)
    const alarmBtn = document.getElementById('setAlarmBtn');
    alarmBtn.addEventListener('click', async () => {
      console.log('🔘 Alarm button clicked');
      
      if (alarmActive) {
        // Cancel both JavaScript timeout and native alarm
        if (alarmTimeoutId) {
          clearTimeout(alarmTimeoutId);
          alarmTimeoutId = null;
        }
        if (window.nativeBridge) {
          window.nativeBridge.cancelAlarm();
        }
        alarmActive = false;
        alarmBtn.textContent = '🔔 Calculate & Set Alarm';
        setBusy(alarmBtn, false);
        showMsg('Alarm canceled.', 'info');
        hideAlarmControls();
        document.getElementById('timeline').style.display = 'none'; // Hide timeline
        return;
      }
      
      // Request notification permission first
      await requestNotificationPermission();
      
      // Set a new alarm
      if (!validateInputs()) {
        console.log('❌ Validation failed');
        return;
      }
      
      setBusy(alarmBtn, true);
      
      try {
        await calculateTimes();
        const wakeStr = document.getElementById('wakeTime').textContent;
        
        // Only proceed if we have a valid wake time
        if (wakeStr && wakeStr !== '--:--') {
          showMsg(`✅ Alarm set for ${wakeStr}`, 'info');
          alarmBtn.textContent = 'Cancel Alarm';
          alarmActive = true;
        } else {
          console.error('❌ No valid wake time calculated');
          showMsg('Failed to calculate alarm time', 'error');
        }
      } catch (error) {
        console.error('❌ Error setting alarm:', error);
        showMsg('Error: ' + error.message, 'error');
      } finally {
        setBusy(alarmBtn, false);
      }
    });

    // Load preferences on page load and request notifications
    window.addEventListener('load', async () => {
      console.log('📱 App loaded');
      loadPrefs();
      await requestNotificationPermission();
      stopAlarmSound(); // Stop any playing alarm sounds when app opens
    });

    // Save preferences when inputs change
    ['workTime', 'workLocation', 'prepTime'].forEach(id => {
      document.getElementById(id).addEventListener('change', savePrefs);
    });

    // Register service worker only when served over http or https
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('service-worker.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showMsg('App updated. Reload to apply.', 'info');
            }
          });
        });
      });
    }
  </script>
</body>
</html>
